# Example actas manifest (version 2). Copy to ~/.config/actas/environments.yaml
# and adapt. Every name below is a placeholder. Reference: docs/manifest.md.
# Needs actas 2.0 (beta 2.0.0b1); `actas --version` shows yours.
#
# The four rules:
#   1. Later layers win, maps merge.
#   2. `null` means off: the tool sees no account.
#   3. Compose upward: a profile is at least as privileged as what it uses.
#   4. A secret is always `scheme:path` (sops:, keychain:, op://, gh:, cmd:).
#
# This file holds names and references only, never secret values.
version: 2

# The first layer of every profile. match, use, description, agents_may_use,
# level and confirm are not allowed here (put them in a role and `use:` it).
defaults:
  git: { name: Ada Example, email: ada@example.com }

# Used when no profile matches the current directory.
fallback: scratch

roles:
  # --- identity pieces -------------------------------------------------------
  gh-personal-ro:
    level: readonly
    github: { auth: "sops:personal/gh_ro_pat" }     # fine-grained PAT, read-only
  gh-personal:                                      # not used below; shown for contrast with gh-personal-ro
    github: { auth: "gh:ada-personal" }             # a gh login: full repo scope, so not "readonly"
  aws-personal-ro:
    level: readonly
    aws: { profile: personal-readonly, region: eu-west-1 }
  aws-personal-power:
    level: power
    aws: { profile: personal-poweruser }            # region still comes from aws-personal-ro
  corp-gateway:
    claude:
      provider: gateway
      base_url: https://llm-gateway.corp.example
      token: "sops:corp-gateway/token"              # one secret, shared by every user of the role

  # --- permission sets: roles that only carry agent rules ----------------------
  no-pulumi:
    permissions: { deny: ["Bash(pulumi up *)", "Bash(pulumi destroy *)"] }
  no-apply:
    permissions: { deny: ["Bash(terraform apply *)", "Bash(terraform destroy *)"] }

  # --- a recipe (docs/recipes.md): a tool without a built-in module -----------
  npm-client-a:
    secret_env: { NPM_TOKEN: "sops:client-a/npm" }  # .npmrc: //registry.npmjs.org/:_authToken=${NPM_TOKEN}

  client-a-base:
    use: [corp-gateway, npm-client-a]
    git: { email: ada@client-a.example }
    github: { auth: "gh:ada-client-a" }

profiles:
  personal:
    description: Personal projects, read-only credentials
    match: [~/code/personal, ~/code/sandbox-*]
    use: [gh-personal-ro, aws-personal-ro, no-pulumi]       # level readonly

  personal-power:                                           # "similar, plus AWS PowerUserAccess"
    description: Personal, with AWS PowerUser (typed confirmation)
    use: [personal, aws-personal-power]                     # read-only PAT kept; AWS becomes PowerUser
    confirm: true                                           # level power; a human types the name

  work:                                                     # a second claude.ai subscription
    match: [~/code/oss-work]
    claude: { home: work }                                  # its own login, settings and history
    github: { auth: "gh:ada-oss" }

  client-a-test:
    match: [~/code/client-a, ~/code/client-a-*]
    use: [client-a-base]                                    # level standard (the default)
    aws: { profile: client-a-test-dev, region: eu-west-1 }
    env: { TF_IN_AUTOMATION: "1" }                          # plain, non-secret variables
    agents_may_use: [client-a-prod]                         # an agent here may run prod read-only commands

  client-a-prod:
    match: [~/code/client-a/infra/prod]                     # the longest match wins
    use: [client-a-base, no-apply]                          # a sibling of test, never built on it
    level: readonly
    github: { auth: "sops:client-a-prod/gh_ro_pat" }        # a read PAT replaces the gh account
    aws: { profile: client-a-prod-readonly, region: eu-west-1 }

  client-b:
    match: [~/code/client-b]
    git: { email: ada@client-b.example }
    github: { auth: "gh:ada-client-b" }
    gcp: { home: client-b, project: client-b-dev,
           impersonate: viewer@client-b-dev.iam.gserviceaccount.com }
    aws: null                                               # no AWS: the aws CLI sees an empty config

  client-c:
    match: [~/code/client-c]
    use: [corp-gateway]
    azure: { home: client-c, subscription: 00000000-0000-0000-0000-000000000000,
             tenant: 11111111-1111-1111-1111-111111111111 }
    aws: null

  partner:
    match: [~/code/partner-org]
    github: { auth: "sops:partner/gh_token" }               # a PAT; git gets a credential helper for it
    tool: codex                                             # `actas run` launches Codex here
    codex: { home: partner }                                # `actas login partner` signs Codex in once

  scratch:                                                  # the fallback: read-only, nothing attached
    level: readonly
