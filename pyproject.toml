# Packaging for `uv tool install` and `pipx install` from git:
#
#   uv tool install git+https://github.com/TsenkoTsenkov/ccenv
#   pipx install git+https://github.com/TsenkoTsenkov/ccenv
#
# bin/ccenv stays the single source of truth. The wheel build (hatch_build.py)
# copies it to the module `ccenv_cli` and changes only the line
# `BUILD = "script"` to `BUILD = "package"`. The version is read from
# `__version__` in bin/ccenv. Nothing is published to PyPI.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ccenv"
dynamic = ["version"]
description = "Credential context env: per-project identities (LLM provider, cloud, GitHub, git, secrets) for any CLI or AI agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Optional for the single-file install; the package always gets it.
dependencies = ["PyYAML>=6"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
ccenv = "ccenv_cli:main"

[project.urls]
Homepage = "https://github.com/TsenkoTsenkov/ccenv"

[tool.hatch.version]
path = "bin/ccenv"

[tool.hatch.build.targets.sdist]
include = ["/bin/ccenv", "/hatch_build.py", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
# The only module is generated by the hook below.
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
