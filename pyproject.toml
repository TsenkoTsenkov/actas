# Packaging for `uv tool install` and `pipx install`, from PyPI (published by
# the release workflow) or from git:
#
#   uv tool install actas            # or: pipx install actas
#   uv tool install git+https://github.com/TsenkoTsenkov/actas
#
# bin/actas stays the single source of truth. The wheel build (hatch_build.py)
# copies it to the module `actas_cli` and changes only the line
# `BUILD = "script"` to `BUILD = "package"`. The version is read from
# `__version__` in bin/actas. The package also
# installs a deprecated `ccenv` command (the name before the rename).
# bin/actas carries the Claude Code skills and the direnv function, so the
# wheel has them without data files: `actas setup skill`, `actas setup direnv`.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "actas"
dynamic = ["version"]
description = "Act as the right identity (LLM provider, cloud accounts, GitHub, git, secrets) for every project, in every terminal and agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Optional for the single-file install; the package always gets it.
dependencies = ["PyYAML>=6"]
keywords = ["credentials", "aws", "gcp", "azure", "github", "claude", "codex", "gemini", "ai-agents", "direnv", "sops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
actas = "actas_cli:main"
# Deprecated: the pre-rename name, the same program. Kept so helper strings in
# settings files synced before the rename and muscle memory keep working.
ccenv = "actas_cli:main"

[project.urls]
Homepage = "https://github.com/TsenkoTsenkov/actas"
Documentation = "https://github.com/TsenkoTsenkov/actas#readme"
Changelog = "https://github.com/TsenkoTsenkov/actas/blob/main/CHANGELOG.md"
Issues = "https://github.com/TsenkoTsenkov/actas/issues"
Funding = "https://buymeacoffee.com/tsenkotsenkov"

[tool.hatch.version]
path = "bin/actas"

[tool.hatch.build.targets.sdist]
include = ["/bin/actas", "/hatch_build.py", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
# The only module is generated by the hook below.
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
